name: build-ios

"on":
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout wallet
        uses: actions/checkout@v4
        with:
          repository: german-national-wallet/de-eudi-wallet-ios
          ref: b047e1c8d23b04cf65de68483f91e56dddbe9f4c
          path: app
          fetch-depth: 1
      - name: Select Xcode 16
        run: |
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
          xcodebuild -version
          xcrun simctl list devices available | head -20
      - name: Build
        run: |
          cd app
          set -o pipefail
          xcodebuild build -project IDGo.xcodeproj -scheme "IDGo Dev" -destination 'generic/platform=iOS Simulator' -skipMacroValidation -skipPackagePluginValidation -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tail -150
