name: build-ios

"on":
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout wallet
        uses: actions/checkout@v4
        with:
          repository: german-national-wallet/de-eudi-wallet-ios
          ref: b047e1c8d23b04cf65de68483f91e56dddbe9f4c
          path: app
          fetch-depth: 1
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/dd
            ~/Library/Caches/org.swift.swiftpm
          key: dd-${{ github.run_id }}
          restore-keys: |
            dd-
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app
          xcodebuild -version
      - name: Make placeholder Firebase config
        run: |
          cat > "$RUNNER_TEMP/fake-gs.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>AIzaSyA1234567890abcdefghijklmnopqrstuv</string>
            <key>GCM_SENDER_ID</key><string>123456789012</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>org.sprind.wallet.dev</string>
            <key>PROJECT_ID</key><string>placeholder-project</string>
            <key>STORAGE_BUCKET</key><string>placeholder-project.appspot.com</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><false/>
            <key>GOOGLE_APP_ID</key><string>1:123456789012:ios:0123456789abcdef</string>
          </dict>
          </plist>
          PLIST
      - name: Build
        run: |
          cd app
          set -o pipefail
          xcodebuild build -project IDGo.xcodeproj -scheme "IDGo Dev" -destination 'generic/platform=iOS Simulator' -skipMacroValidation -skipPackagePluginValidation -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tail -60
      - name: Boot simulator, install, launch
        run: |
          set -x
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name '*.app' | head -1)
          echo "APP=$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "BID=$BID"
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone 1[6-9]|iPhone 2[0-9]' | head -1 | grep -oE '[0-9A-F-]{36}' | head -1)
          if [ -z "$UDID" ]; then UDID=$(xcrun simctl list devices available | grep -oE '[0-9A-F-]{36}' | head -1); fi
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          cp "$RUNNER_TEMP/fake-gs.plist" "$APP/GoogleService-Info.plist"
          echo "injected Firebase plist"
          xcrun simctl install "$UDID" "$APP"
          ( xcrun simctl launch --console-pty "$UDID" "$BID" > "$RUNNER_TEMP/app.log" 2>&1 & ) || true
          sleep 12
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/launch.png" || true
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "IDGo"' 2>/dev/null | tail -60 || true
          echo "--- app.log ---"; tail -80 "$RUNNER_TEMP/app.log" || true
          echo "--- crash reports ---"; ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*IDGo* 2>/dev/null | head -2); do echo "== $f"; head -60 "$f"; done
          echo "BID=$BID" > "$RUNNER_TEMP/meta.txt"
          echo "UDID=$UDID" >> "$RUNNER_TEMP/meta.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: launch-shot
          path: |
            ${{ runner.temp }}/launch.png
            ${{ runner.temp }}/meta.txt
            ${{ runner.temp }}/app.log
          if-no-files-found: warn
